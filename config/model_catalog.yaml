models:
  - model_name: customer-churn-knn
    algorithm: knn
    framework: scikit-learn
    runtime_class: tabular-cpu
    task: binary_classification
    alias: champion
    version: 4
    endpoint: /v1/models/customer-churn-knn:predict
    input_schema: customer_features_v1
    purpose: local_similarity_comparison
    status: ready
    validation_metrics: {primary_score: 0.74, pr_auc: 0.74, brier_score: 0.18}
  - model_name: customer-churn-naive-bayes
