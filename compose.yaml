services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow-local-password
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mlflow

  mlflow:
    build:
      context: .
      dockerfile: common/docker/Dockerfile.mlflow
      args:
        ARTIFACT_DEPENDENCIES: boto3
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://mlflow:mlflow-local-password@postgres:5432/mlflow
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
    ports: ["5000:5000"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  model-service:
    build:
      context: .
      dockerfile: common/docker/Dockerfile.model-service
    ports: ["8010:8010"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow: {condition: service_healthy}

  api:
    build:
      context: .
      dockerfile: common/docker/Dockerfile.api
    ports: ["8000:8000"]
    environment:
      AIOFFICE_MLFLOW_TRACKING_URI: http://mlflow:5000
      AIOFFICE_MODEL_SERVICE_BASE_URL: http://model-service:8010
      AIOFFICE_MODEL_CATALOG_PATH: /app/config/model_catalog.yaml
      AIOFFICE_ALGORITHM_CATALOG_PATH: /app/config/algorithm_catalog.yaml
    depends_on:
      mlflow: {condition: service_healthy}
      model-service: {condition: service_started}

volumes:
  postgres-data:
  minio-data:
